name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run generate:store-assets
      - run: npm run check:release
        env:
          EXPO_PUBLIC_PRIVACY_POLICY_URL: https://trotroos.com/privacy
      - run: npm test
      - run: npm run lint
